<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniFly 馬達推力誤差計算器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#f1f5f9;display:flex;align-items:center;justify-content:center;padding:16px;font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#1f2937;position:relative;overflow:hidden}
.blob{position:absolute;width:60%;height:60%;border-radius:50%;filter:blur(64px);pointer-events:none}
.blob.a{top:-20%;left:-20%;background:rgba(96,165,250,.1)}
.blob.b{bottom:-20%;right:-20%;background:rgba(129,140,248,.1)}
.card{position:relative;z-index:1;background:#fff;width:100%;max-width:448px;border-radius:16px;box-shadow:0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.1);border:1px solid rgba(226,232,240,.8);overflow:hidden}
.header{background:#1e293b;color:#fff;padding:20px;display:flex;align-items:center;justify-content:space-between}
.title{display:flex;align-items:center;gap:10px}
.title svg{width:24px;height:24px;color:#60a5fa;animation:spin 8s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.title h1{font-size:16px;font-weight:700;letter-spacing:.05em;display:flex;align-items:baseline;gap:8px}
.title h1 small{font-size:12px;color:#94a3b8;font-weight:500}
.icon-btn{background:none;border:none;cursor:pointer;padding:8px;border-radius:50%;position:relative;color:#e2e8f0;display:flex;transition:background .2s}
.icon-btn:hover{background:rgba(51,65,85,.8)}
.icon-btn svg{width:20px;height:20px}
.dot{position:absolute;top:4px;right:4px;width:10px;height:10px;background:#ef4444;border-radius:50%;box-shadow:0 0 0 2px #1e293b;display:none}
.body{padding:24px;display:flex;flex-direction:column;gap:24px}
.inputs{display:flex;gap:16px}
.field{flex:1}
.field label{display:block;font-size:12px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.wrap{position:relative}
.wrap input{width:100%;padding:10px 32px 10px 12px;border:1px solid #cbd5e1;border-radius:12px;font-size:18px;font-weight:600;outline:none;transition:all .2s;font-family:inherit}
.wrap input:focus{border-color:#3b82f6;box-shadow:0 0 0 2px #3b82f6}
.wrap span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#94a3b8;font-weight:700;font-size:14px}
.result{border-radius:16px;border:1px solid #f1f5f9;padding:20px;background:#f9fafb;transition:all .3s}
.result.left{background:#fffbeb}
.result.right{background:#eff6ff}
.result.eq{background:#f0fdf4}
.result.err{background:rgba(254,242,242,.7);border-color:#fecaca}
.result h2{font-size:12px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em;margin-bottom:16px}
.empty{display:flex;flex-direction:column;align-items:center;padding:32px 0;color:#94a3b8;gap:8px}
.empty svg{width:40px;height:40px;opacity:.25}
.empty p{font-size:12px;font-weight:600}
.status{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px}
.status svg{width:22px;height:22px}
.c-gray{color:#6b7280}.c-amber{color:#d97706}.c-blue{color:#2563eb}.c-green{color:#16a34a}.c-red{color:#dc2626}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding-top:16px;margin-top:16px;border-top:1px solid rgba(226,232,240,.6)}
.grid .lbl{font-size:12px;color:#64748b;font-weight:500;margin-bottom:4px}
.grid .val{font-size:18px;font-weight:700;color:#1e293b}
.grid .val small{font-size:12px;color:#94a3b8;font-weight:400}
.pct{grid-column:span 2;background:rgba(255,255,255,.7);border:1px solid rgba(226,232,240,.4);border-radius:12px;padding:14px;margin-top:8px;transition:all .3s}
.result.err .pct{background:#fff;border-color:#fecaca}
.pct .row{display:flex;justify-content:space-between;align-items:center}
.pct .row .t{font-size:14px;color:#475569;font-weight:600}
.pct .row .n{font-size:24px;font-weight:900;letter-spacing:-.02em;color:#1e293b}
.result.err .pct .n{color:#dc2626}
.warn{display:none;gap:6px;align-items:flex-start;margin-top:10px;padding:10px;background:#fef2f2;border:1px solid #fee2e2;border-radius:8px;font-size:12px;color:#dc2626;font-weight:500}
.result.err .warn{display:flex}
.warn svg{width:16px;height:16px;flex-shrink:0;margin-top:2px;color:#ef4444}
.hint{font-size:11px;color:#94a3b8;text-align:center}
/* 歷史側欄 */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.4);backdrop-filter:blur(4px);z-index:50;opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.open{opacity:1;pointer-events:auto}
.drawer{position:absolute;top:0;right:0;height:100%;width:100%;max-width:384px;background:#fff;box-shadow:0 25px 50px -12px rgba(0,0,0,.25);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s ease-out}
.overlay.open .drawer{transform:none}
.d-head{padding:20px;border-bottom:1px solid #f1f5f9;background:#f8fafc;display:flex;align-items:center;justify-content:space-between}
.d-head .l{display:flex;align-items:center;gap:8px}
.d-head svg{width:20px;height:20px;color:#475569}
.d-head h2{font-size:16px;font-weight:700;color:#1e293b}
.count{background:#e2e8f0;color:#334155;font-size:12px;padding:2px 8px;border-radius:999px;font-weight:700}
.d-head .icon-btn{color:#64748b}
.d-head .icon-btn:hover{background:#e2e8f0}
.d-actions{padding:10px 16px;border-bottom:1px solid #f1f5f9;display:flex;justify-content:flex-end}
.clear{background:none;border:none;font-size:12px;color:#ef4444;cursor:pointer;font-weight:600;padding:4px 8px;border-radius:6px}
.clear:hover{background:#fef2f2}
.list{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:rgba(248,250,252,.5)}
.none{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#94a3b8;gap:8px;padding:24px;text-align:center}
.none svg{width:48px;height:48px;opacity:.25}
.none b{font-size:14px;font-weight:600}
.none p{font-size:12px}
.rec{background:#fff;padding:14px;border-radius:12px;border:1px solid #f1f5f9;box-shadow:0 1px 2px rgba(0,0,0,.05);transition:box-shadow .2s}
.rec:hover{box-shadow:0 4px 6px -1px rgba(0,0,0,.1)}
.rec.err{border-color:#fecaca;background:rgba(254,242,242,.3)}
.rec .top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#94a3b8;margin-bottom:8px}
.rec .top .time{display:flex;align-items:center;gap:4px;font-weight:500}
.rec .top svg{width:14px;height:14px}
.rec .del{background:none;border:none;color:#94a3b8;cursor:pointer;padding:4px;border-radius:4px;display:flex}
.rec .del:hover{background:#fef2f2;color:#ef4444}
.rec .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;background:#f8fafc;padding:8px;border-radius:8px;border:1px solid #f1f5f9;margin-bottom:8px}
.rec .nums i{display:block;font-style:normal;font-size:10px;color:#94a3b8;text-transform:uppercase;font-weight:700}
.rec .nums b{font-size:14px;color:#1e293b}
.rec .foot{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.badge{font-size:12px;padding:2px 8px;border-radius:999px;font-weight:700}
.badge.red{background:#fee2e2;color:#b91c1c}.badge.amber{background:#fef3c7;color:#b45309}.badge.blue{background:#dbeafe;color:#1d4ed8}.badge.green{background:#dcfce7;color:#15803d}
.rec .e{text-align:right}
.rec .e i{display:block;font-style:normal;font-size:10px;color:#94a3b8;font-weight:700}
.rec .e b{font-size:16px;font-weight:900;color:#1e293b}
.rec.err .e b{color:#dc2626}
</style>
</head>
<body>
<div class="blob a"></div><div class="blob b"></div>

<!-- 隱藏的 SVG 圖示庫 -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></symbol>
    <symbol id="i-scale" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
  </defs>
</svg>

<div class="card">
  <div class="header">
    <div class="title">
      <svg><use href="#i-settings"/></svg>
      <h1><span>MiniFly</span><small>馬達推力誤差計算器</small></h1>
    </div>
    <button class="icon-btn" id="openHistory" title="檢視歷史紀錄">
      <svg><use href="#i-history"/></svg>
      <span class="dot" id="dot"></span>
    </button>
  </div>

  <div class="body">
    <div class="inputs">
      <div class="field">
        <label for="left">左馬達 (L)</label>
        <div class="wrap"><input id="left" type="number" min="0" step="0.1" placeholder="0.0" inputmode="decimal"><span>g</span></div>
      </div>
      <div class="field">
        <label for="right">右馬達 (R)</label>
        <div class="wrap"><input id="right" type="number" min="0" step="0.1" placeholder="0.0" inputmode="decimal"><span>g</span></div>
      </div>
    </div>

    <div class="result" id="result"></div>
    <p class="hint">停止輸入約 1.2 秒後自動記錄；紀錄儲存在本機瀏覽器</p>
  </div>
</div>

<!-- 歷史紀錄側邊欄 -->
<div class="overlay" id="overlay">
  <div class="drawer" id="drawer">
    <div class="d-head">
      <div class="l">
        <svg><use href="#i-history"/></svg>
        <h2>歷史測試紀錄</h2>
        <span class="count" id="count">0</span>
      </div>
      <button class="icon-btn" id="closeHistory"><svg><use href="#i-x"/></svg></button>
    </div>
    <div class="d-actions"><button class="clear" id="clearAll">清空全部</button></div>
    <div class="list" id="list"></div>
  </div>
</div>

<script>
(function () {
  const ALERT_THRESHOLD = 5.0;
  const STORAGE_KEY = 'minifly_records';
  const $ = id => document.getElementById(id);
  const icon = (name) => `<svg><use href="#i-${name}"/></svg>`;

  let records = [];
  let lastSaved = { left: null, right: null };
  let timer = null;

  // ---- 本機儲存（localStorage 不可用時退回記憶體） ----
  function load() {
    try { records = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch (e) { records = []; }
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); } catch (e) {}
  }

  // ---- 計算 ----
  function calc(l, r) {
    const average = (l + r) / 2;
    const difference = Math.abs(l - r);
    const errorPercentage = average > 0 ? (difference / average) * 100 : 0;
    let statusText = '推力平衡 (Left = Right)', kind = 'eq';
    if (l > r) { statusText = '左大右小 (Left > Right)'; kind = 'left'; }
    else if (r > l) { statusText = '右大左小 (Right > Left)'; kind = 'right'; }
    return { average, difference, errorPercentage, statusText, kind, isHighError: errorPercentage >= ALERT_THRESHOLD };
  }

  function readInputs() {
    const l = parseFloat($('left').value), r = parseFloat($('right').value);
    const valid = !isNaN(l) && !isNaN(r) && l >= 0 && r >= 0;
    return { l, r, valid };
  }

  // ---- 即時結果 ----
  function renderResult() {
    const { l, r, valid } = readInputs();
    const box = $('result');
    if (!valid) {
      box.className = 'result';
      box.innerHTML = `<h2>計算結果</h2><div class="empty">${icon('scale')}<p>請在上方輸入左右馬達的推力 (g)</p></div>`;
      return;
    }
    const c = calc(l, r);
    const map = { left: ['c-amber', 'left', 'left'], right: ['c-blue', 'right', 'right'], eq: ['c-green', 'check', 'eq'] };
    const [color, ic, bg] = map[c.kind];
    box.className = 'result ' + (c.isHighError ? 'err' : bg);
    box.innerHTML = `
      <h2>計算結果</h2>
      <div class="status ${c.isHighError ? 'c-red' : color}">${icon(ic)}<span>${c.statusText}</span></div>
      <div class="grid">
        <div><div class="lbl">基準 (平均值)</div><div class="val">${c.average.toFixed(1)} <small>g</small></div></div>
        <div><div class="lbl">推力差值</div><div class="val">${c.difference.toFixed(1)} <small>g</small></div></div>
        <div class="pct">
          <div class="row"><div class="t">差異百分比</div><div class="n">${c.errorPercentage.toFixed(2)} %</div></div>
          <div class="warn">${icon('alert')}<span>誤差已達 ${ALERT_THRESHOLD}%，建議更換或校正馬達！</span></div>
        </div>
      </div>`;
  }

  // ---- 自動儲存（debounce 1.2 秒 + 防重複） ----
  function scheduleSave() {
    clearTimeout(timer);
    const { l, r, valid } = readInputs();
    if (!valid) return;
    if (lastSaved.left === l && lastSaved.right === r) return;
    timer = setTimeout(() => {
      const c = calc(l, r);
      records.unshift({
        id: Date.now() + '-' + Math.random().toString(36).slice(2, 7),
        leftThrust: l,
        rightThrust: r,
        average: +c.average.toFixed(2),
        difference: +c.difference.toFixed(2),
        errorPercentage: +c.errorPercentage.toFixed(2),
        statusText: c.statusText,
        isHighError: c.isHighError,
        timestamp: Date.now()
      });
      lastSaved = { left: l, right: r };
      save();
      renderHistory();
    }, 1200);
  }

  // ---- 歷史紀錄 ----
  function formatTime(ts) {
    const d = new Date(ts);
    return d.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) +
      ' (' + d.toLocaleDateString('zh-TW', { month: '2-digit', day: '2-digit' }) + ')';
  }

  function renderHistory() {
    $('count').textContent = records.length;
    $('dot').style.display = records.length ? 'block' : 'none';
    $('clearAll').style.display = records.length ? '' : 'none';
    const list = $('list');
    if (!records.length) {
      list.innerHTML = `<div class="none">${icon('clock')}<b>尚無測試歷史紀錄</b><p>只要在首頁輸入推力數值，完成後將自動在此出現！</p></div>`;
      return;
    }
    list.innerHTML = records.map(rec => {
      const badge = rec.isHighError ? 'red' : rec.statusText.includes('左大') ? 'amber' : rec.statusText.includes('右大') ? 'blue' : 'green';
      return `
      <div class="rec ${rec.isHighError ? 'err' : ''}">
        <div class="top">
          <span class="time">${icon('clock')}${formatTime(rec.timestamp)}</span>
          <button class="del" data-id="${rec.id}" title="刪除紀錄">${icon('trash')}</button>
        </div>
        <div class="nums">
          <div><i>L 左馬達</i><b>${rec.leftThrust}g</b></div>
          <div><i>R 右馬達</i><b>${rec.rightThrust}g</b></div>
          <div><i>平均值</i><b>${rec.average}g</b></div>
        </div>
        <div class="foot">
          <span class="badge ${badge}">${rec.statusText.split(' ')[0]}</span>
          <div class="e"><i>誤差值</i><b>${rec.errorPercentage}%</b></div>
        </div>
      </div>`;
    }).join('');
  }

  // ---- 事件 ----
  ['left', 'right'].forEach(id => $(id).addEventListener('input', () => { renderResult(); scheduleSave(); }));
  $('openHistory').addEventListener('click', () => $('overlay').classList.add('open'));
  $('closeHistory').addEventListener('click', () => $('overlay').classList.remove('open'));
  $('overlay').addEventListener('click', e => { if (e.target === $('overlay')) $('overlay').classList.remove('open'); });
  $('drawer').addEventListener('click', e => {
    const btn = e.target.closest('.del');
    if (!btn) return;
    records = records.filter(r => r.id !== btn.dataset.id);
    save(); renderHistory();
  });
  $('clearAll').addEventListener('click', () => {
    if (confirm('確定要清空所有歷史紀錄嗎？')) { records = []; save(); renderHistory(); }
  });

  // ---- 初始化 ----
  load();
  renderResult();
  renderHistory();
})();
</script>
</body>
</html>
